name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  actions: read

jobs:
  # =========================================================================
  # 1. LINT & FORMAT CHECKS
  # =========================================================================
  lint-and-format:
    name: Lint & Format Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Run ESLint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Check Code Formatting (Prettier)
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Verify Build
        run: pnpm build

  # =========================================================================
  # 2. UNIT, INTEGRATION & E2E TESTS
  # =========================================================================
  test:
    name: Unit, Integration & E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: levora_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/levora_test?schema=public
      DIRECT_URL: postgresql://test_user:test_password@localhost:5432/levora_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      PORT: 3000
      JWT_SECRET: ci-cd-test-jwt-secret-key-minimum-32-chars-long
      OAUTH_ENCRYPTION_KEY: 'test-encryption-key-32charslong!!'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Enable CITEXT Extension in Test Database
        run: PGPASSWORD=test_password psql -h localhost -U test_user -d levora_test -c "CREATE EXTENSION IF NOT EXISTS citext;"

      - name: Push Schema to Test Database
        run: pnpm exec prisma db push --skip-generate

      - name: Seed database
        run: npx prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Unit & Integration Tests
        run: pnpm test -- --passWithNoTests

      - name: Run E2E Tests
        run: pnpm test:e2e

  # =========================================================================
  # 3. BUILD & TEST CONTAINER
  # =========================================================================
  build-and-test-container:
    name: Build & Test Container
    needs: [test, lint-and-format]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: levora_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable CITEXT Extension in Test Database
        run: PGPASSWORD=test_password psql -h localhost -U test_user -d levora_test -c "CREATE EXTENSION IF NOT EXISTS citext;"

      - name: Build Docker Image
        run: docker build -t levora-backend:test .

      - name: Run Application Container
        run: |
          docker run -d \
            --name levora-app \
            --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e API_PREFIX=api \
            -e DATABASE_URL="postgresql://test_user:test_password@localhost:5432/levora_test?schema=public" \
            -e DIRECT_URL="postgresql://test_user:test_password@localhost:5432/levora_test?schema=public" \
            -e REDIS_HOST="localhost" \
            -e REDIS_PORT="6379" \
            -e JWT_SECRET="ci-cd-test-jwt-secret-key-minimum-32-chars-long" \
            -e LOG_LEVEL="info" \
            -e OAUTH_ENCRYPTION_KEY="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" \
            levora-backend:test

      - name: Wait for Container Readiness
        run: |
          echo "Waiting for container to become healthy..."
          TIMEOUT=60
          ELAPSED=0
          until curl -s -f http://localhost:3000/api/v1/health > /dev/null 2>&1; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "::error::Container failed to become healthy within $TIMEOUT seconds."
              docker logs levora-app
              exit 1
            fi
            echo "Waiting for application startup... ($ELAPSED/$TIMEOUT s)"
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          echo "Application container is healthy!"

      - name: Run API Smoke Tests Against Running Container
        run: |
          set -e

          echo "=== 1. Test GET /api/v1/health (Liveness) ==="
          HEALTH_RES=$(curl -s -w "\n%{http_code}" http://localhost:3000/api/v1/health)
          HEALTH_CODE=$(echo "$HEALTH_RES" | tail -n1)
          HEALTH_BODY=$(echo "$HEALTH_RES" | sed '$d')
          echo "Response Code: $HEALTH_CODE"
          echo "Response Body: $HEALTH_BODY"
          if [ "$HEALTH_CODE" != "200" ]; then
            echo "::error::Health probe failed with status $HEALTH_CODE"
            exit 1
          fi

          echo "=== 2. Test GET /api/v1/health/ready (Readiness) ==="
          READY_RES=$(curl -s -w "\n%{http_code}" http://localhost:3000/api/v1/health/ready)
          READY_CODE=$(echo "$READY_RES" | tail -n1)
          READY_BODY=$(echo "$READY_RES" | sed '$d')
          echo "Response Code: $READY_CODE"
          echo "Response Body: $READY_BODY"
          if [ "$READY_CODE" != "200" ]; then
            echo "::error::Readiness probe failed with status $READY_CODE"
            exit 1
          fi

          echo "=== 3. Test POST /api/v1/auth/register ==="
          REG_RES=$(curl -s -w "\n%{http_code}" -X POST http://localhost:3000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"container-test@example.com","password":"Password123!","firstName":"Container","lastName":"Tester"}')
          REG_CODE=$(echo "$REG_RES" | tail -n1)
          REG_BODY=$(echo "$REG_RES" | sed '$d')
          echo "Response Code: $REG_CODE"
          echo "Response Body: $REG_BODY"
          if [ "$REG_CODE" != "201" ]; then
            echo "::error::Registration test failed with status $REG_CODE"
            exit 1
          fi

          echo "=== 4. Test POST /api/v1/auth/login ==="
          LOGIN_RES=$(curl -s -w "\n%{http_code}" -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"container-test@example.com","password":"Password123!"}')
          LOGIN_CODE=$(echo "$LOGIN_RES" | tail -n1)
          LOGIN_BODY=$(echo "$LOGIN_RES" | sed '$d')
          echo "Response Code: $LOGIN_CODE"
          echo "Response Body: $LOGIN_BODY"
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "::error::Login test failed with status $LOGIN_CODE"
            exit 1
          fi

          echo "All container API tests passed successfully!"

      - name: Dump Container Logs on Failure
        if: failure()
        run: docker logs levora-app

      - name: Stop Container
        if: always()
        run: docker stop levora-app || true

  # =========================================================================
  # 4. CHANGE PREVIEW SERVICE BRANCH
  # =========================================================================
  change-preview-branch:
    name: Change Preview Service Branch
    needs: [build-and-test-container]
    runs-on: ubuntu-latest

    steps:
      - name: Change Preview Service Branch
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_STAGING }}
          SERVICE_ID: ${{ secrets.RENDER_PREVIEW_SERVICE_ID }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY_STAGING or RENDER_PREVIEW_SERVICE_ID is not configured."
            exit 1
          fi
          if [ -z "$BRANCH" ]; then
            echo "::error::github.head_ref is empty."
            exit 1
          fi

          echo "Updating Preview service ($SERVICE_ID) branch to '$BRANCH'..."
          response=$(curl -s -w "\n%{http_code}" -X PATCH "https://api.render.com/v1/services/$SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"branch\": \"$BRANCH\"}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Render API Response: $body"
          echo "HTTP Status Code: $http_code"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "::notice::Preview service branch changed to '$BRANCH' successfully."
          else
            echo "::error::Failed to update Preview service branch (HTTP $http_code): $body"
            exit 1
          fi

  # =========================================================================
  # 5. DEPLOY TO PREVIEW SERVICE
  # =========================================================================
  deploy-preview:
    name: Deploy to Preview Service
    needs: [change-preview-branch]
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Preview Deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_STAGING }}
          SERVICE_ID: ${{ secrets.RENDER_PREVIEW_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY_STAGING or RENDER_PREVIEW_SERVICE_ID is not configured."
            exit 1
          fi

          echo "Triggering deployment on Preview service ($SERVICE_ID)..."
          response=$(curl -s -w "\n%{http_code}" -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "clear"}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Render API Response: $body"
          echo "HTTP Status Code: $http_code"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "::notice::Preview deployment triggered successfully (HTTP $http_code)."
          else
            echo "::error::Render Preview deployment failed with HTTP status $http_code: $body"
            exit 1
          fi

  # =========================================================================
  # 6. WAIT FOR PREVIEW DEPLOYMENT
  # =========================================================================
  wait-for-preview:
    name: Wait for Preview Deployment
    needs: [deploy-preview]
    runs-on: ubuntu-latest

    steps:
      - name: Poll Render Preview Deployment Status
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_STAGING }}
          SERVICE_ID: ${{ secrets.RENDER_PREVIEW_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY_STAGING or RENDER_PREVIEW_SERVICE_ID is not configured."
            exit 1
          fi

          echo "Polling Render API for Preview service ($SERVICE_ID) deployment status..."
          START_TIME=$(date +%s)
          TIMEOUT=300

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "::error::Preview deployment timed out after 5 minutes ($ELAPSED seconds)."
              exit 1
            fi

            RESPONSE=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=1")

            STATUS=$(echo "$RESPONSE" | jq -r '.[0].deploy.status // .[0].status // empty')

            echo "Current Preview deployment status: '$STATUS' (Elapsed: ${ELAPSED}s / ${TIMEOUT}s)"

            case "$STATUS" in
              "live")
                echo "Preview deployment is LIVE and healthy!"
                exit 0
                ;;
              "failed"|"build_failed"|"deploy_failed"|"canceled"|"deactivated")
                echo "::error::Preview deployment failed with status: $STATUS"
                echo "Full response: $RESPONSE"
                exit 1
                ;;
              "created"|"build_in_progress"|"update_in_progress"|"in_progress"|"pending"|*)
                echo "Deployment in progress (status: ${STATUS:-unknown}). Waiting 60 seconds before retrying..."
                sleep 60
                ;;
            esac
          done

  # =========================================================================
  # 7. RUN SMOKE TESTS (Newman)
  # =========================================================================
  run-preview-tests:
    name: Run Smoke Tests (Newman)
    needs: [wait-for-preview]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman Smoke Tests Against Preview URL
        env:
          RAW_URL: ${{ secrets.RENDER_PREVIEW_URL }}
        run: |
          if [ -z "$RAW_URL" ]; then
            echo "::error::RENDER_PREVIEW_URL secret is not configured."
            exit 1
          fi

          # Ensure https:// prefix and trim trailing slash
          PREVIEW_URL="$RAW_URL"
          if [[ ! "$PREVIEW_URL" =~ ^https?:// ]]; then
            PREVIEW_URL="https://$PREVIEW_URL"
          fi
          PREVIEW_URL="${PREVIEW_URL%/}"

          echo "Running Newman tests against: $PREVIEW_URL/api/v1"

          newman run tests/levora-smoke-tests.json \
            --env-var baseUrl="$PREVIEW_URL" \
            --reporters cli,json \
            --reporter-json-export newman-report.json

      - name: Upload Newman Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.json
          retention-days: 7

  # =========================================================================
  # 8. RESET PREVIEW SERVICE BRANCH
  # =========================================================================
  reset-preview-branch:
    name: Reset Preview Branch to Main
    needs: [run-preview-tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Reset Preview Service Branch
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_STAGING }}
          SERVICE_ID: ${{ secrets.RENDER_PREVIEW_SERVICE_ID }}
          BRANCH: 'main'
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$SERVICE_ID" ]; then
            echo "::warn::RENDER_API_KEY_STAGING or RENDER_PREVIEW_SERVICE_ID is not configured. Skipping branch reset."
            exit 0
          fi

          echo "Resetting Preview service ($SERVICE_ID) branch to '$BRANCH'..."
          response=$(curl -s -w "\n%{http_code}" -X PATCH "https://api.render.com/v1/services/$SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"branch\": \"$BRANCH\"}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Render API Response: $body"
          echo "HTTP Status Code: $http_code"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "::notice::Preview service branch reset to 'main' successfully."
          else
            echo "::warn::Failed to reset Preview service branch (HTTP $http_code): $body"
          fi
