# هوية المشروع (يجب أن يكون projectKey فريداً)
sonar.projectKey=afaq-backend
sonar.projectName=Afaq Backend
sonar.projectVersion=1.0

# الكود المصدري
sonar.sources=src
sonar.sourceEncoding=UTF-8

# استثناءات مهمة (ملفات الحزم، البناء، التغطية، الاختبارات)
sonar.exclusions=**/node_modules/**, **/dist/**, **/coverage/**, **/*.spec.ts, **/*.e2e-spec.ts

# إعدادات الاختبارات (اختياري)
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts, **/*.e2e-spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
