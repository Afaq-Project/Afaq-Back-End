openapi: 3.0.3
info:
  title: AI Conversation Management API
  version: 1.0.0
  description: Endpoints for browsing past AI writing assistant conversations and loading message histories.
paths:
  /api/v1/editor/ai/conversations:
    get:
      tags:
        - AI Conversations
      summary: List authenticated user's conversations
      description: Returns a paginated list of conversations belonging to the authenticated user, ordered from newest to oldest by last activity.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-based)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
          description: Items per page
      responses:
        '200':
          description: Successfully retrieved conversations list
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: OK
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/editor/ai/conversations/{conversationId}/messages:
    get:
      tags:
        - AI Conversations
      summary: Retrieve message history for a conversation
      description: Returns a paginated list of chronological turns (oldest to newest) for a specific conversation owned by the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique conversation session UUID
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-based)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
          description: Items per page (default 20, max 50)
      responses:
        '200':
          description: Successfully retrieved message history
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: OK
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationMessage'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ConversationSummary:
      type: object
      required:
        - id
        - title
        - createdAt
        - updatedAt
        - messageCount
        - lastMessagePreview
      properties:
        id:
          type: string
          format: uuid
          example: 3bd69d37-a966-4a53-9f20-3d26fc25f7ce
        title:
          type: string
          example: Scholarship Essay Strategy
        createdAt:
          type: string
          format: date-time
          example: '2026-10-21T08:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-21T08:15:30.000Z'
        messageCount:
          type: integer
          example: 6
        lastMessagePreview:
          type: string
          nullable: true
          example: 'Here is an improved conclusion highlighting your leadership credentials...'

    ConversationMessage:
      type: object
      required:
        - id
        - role
        - content
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: 52a0c7fe-6ff1-4165-aaf5-b1327f85b525
        role:
          type: string
          enum: [user, assistant]
          example: assistant
        content:
          type: string
          example: 'I recommend focusing on your specific contribution to the research team.'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-21T08:15:30.000Z'

    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 35
        totalPages:
          type: integer
          example: 2

  responses:
    Unauthorized:
      description: Authentication token missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized
              errors:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      example: AUTH_TOKEN_MISSING
                    message:
                      type: string
                      example: Missing token

    NotFound:
      description: Conversation not found or owned by another user
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                example: 404
              message:
                type: string
                example: Conversation not found
              errors:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      example: SYSTEM_RESOURCE_NOT_FOUND
                    message:
                      type: string
                      example: Conversation not found
